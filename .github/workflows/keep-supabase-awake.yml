# A daily database read so Supabase's free plan does not pause Vif's backend.
# The key is the publishable one already shipped in the app.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: https://lgwcbndkssxbojqaqjes.supabase.co
          SUPABASE_KEY: sb_publishable_U5rnQTMlfmUPU370jPz3gw_pLkCmrL9
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 30 --retry 3 \
            --header "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1"
